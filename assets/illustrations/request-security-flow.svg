<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d">
<title id="t">Proposed secure request processing flow</title>
<desc id="d">A request is validated, authenticated, authorized, checked against quota, routed to an approved service, and returned with a normalized response and correlation ID. Failed checks are rejected before forwarding.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1730"/><stop offset="1" stop-color="#1d3158"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><style>.box{fill:#142c4a;stroke:#60a5fa;stroke-width:2}.txt{font:700 18px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 14px Inter,Arial,sans-serif;fill:#cbd5e1}.line{stroke:url(#a);stroke-width:4;fill:none;stroke-linecap:round}.cap{font:700 13px Inter,Arial,sans-serif;fill:#67e8f9;letter-spacing:2px}</style></defs>
<rect width="1400" height="420" rx="26" fill="url(#bg)"/>
<text x="52" y="58" class="cap">PROPOSED REQUEST DECISION PIPELINE</text>
<g>
<rect x="52" y="145" width="165" height="112" rx="16" class="box"/><text x="134" y="190" text-anchor="middle" class="txt">Validate</text><text x="134" y="218" text-anchor="middle" class="sub">Method · Size</text><text x="134" y="239" text-anchor="middle" class="sub">Headers · Body</text>
<rect x="282" y="145" width="165" height="112" rx="16" class="box"/><text x="364" y="190" text-anchor="middle" class="txt">Authenticate</text><text x="364" y="218" text-anchor="middle" class="sub">Verify claims</text><text x="364" y="239" text-anchor="middle" class="sub">Trusted identity</text>
<rect x="512" y="145" width="165" height="112" rx="16" class="box"/><text x="594" y="190" text-anchor="middle" class="txt">Authorize</text><text x="594" y="218" text-anchor="middle" class="sub">Route permission</text><text x="594" y="239" text-anchor="middle" class="sub">Default deny</text>
<rect x="742" y="145" width="165" height="112" rx="16" class="box"/><text x="824" y="190" text-anchor="middle" class="txt">Apply quota</text><text x="824" y="218" text-anchor="middle" class="sub">Rate + concurrency</text><text x="824" y="239" text-anchor="middle" class="sub">Bounded capacity</text>
<rect x="972" y="145" width="165" height="112" rx="16" class="box"/><text x="1054" y="190" text-anchor="middle" class="txt">Route</text><text x="1054" y="218" text-anchor="middle" class="sub">Fixed service ID</text><text x="1054" y="239" text-anchor="middle" class="sub">Deadline + filters</text>
<rect x="1202" y="145" width="145" height="112" rx="16" class="box"/><text x="1274" y="190" text-anchor="middle" class="txt">Respond</text><text x="1274" y="218" text-anchor="middle" class="sub">Safe mapping</text><text x="1274" y="239" text-anchor="middle" class="sub">Correlation ID</text>
<path d="M217 201H282M447 201H512M677 201H742M907 201H972M1137 201H1202" class="line"/>
</g>
<text x="52" y="322" class="sub">Any failed validation, identity, permission, or quota decision rejects the request before an upstream call.</text>
<text x="52" y="350" class="sub">This is a design illustration, not a screenshot or evidence of implemented middleware.</text>
</svg>
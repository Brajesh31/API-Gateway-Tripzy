    <circle cx="490" cy="150" r="8"/><circle cx="490" cy="350" r="8"/>
    <circle cx="1190" cy="150" r="8"/><circle cx="1210" cy="250" r="8"/><circle cx="1190" cy="350" r="8"/>
  </g>
  <text x="92" y="86" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="5">TRIPZY PLATFORM ENGINEERING</text>
  <text x="92" y="250" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">API GATEWAY</text>
  <text x="92" y="306" fill="#c7d2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="500">One controlled entry point.</text>
  <text x="92" y="345" fill="#c7d2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="500">Explicit contracts. Observable boundaries.</text>
  <text x="92" y="454" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="2">ARCHITECTURE FOUNDATION · NODE.JS · MICROSERVICES</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d">
<title id="t">Proposed API Gateway Tripzy architecture</title>
<desc id="d">External clients connect through an HTTPS edge to the gateway, which applies request context, identity verification, authorization, quota and trusted routing before calling approved upstream services. Redacted telemetry is emitted separately.</desc>

name: "⚡ Performance concern"
description: Report a measured performance issue or propose a performance investigation.
title: "[Performance]: "
labels: ["performance", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not run load tests against production or systems you do not own or have permission to test. Redact private endpoints and data.
  - type: input
    id: environment
    attributes:
      label: Test environment and commit SHA
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurement method and results
      description: Include concurrency, duration, throughput, p50/p95/p99 and error ratio where available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or target
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and reproduction steps
    validations:
      required: true

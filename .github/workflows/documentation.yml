name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown structure and local references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          errors = []
          markdown = list(root.rglob("*.md"))
          for path in markdown:
              content = path.read_text(encoding="utf-8")
              if not content.strip():
                  errors.append(f"{path}: empty Markdown file")
              for target in re.findall(r"!\[[^\]]*\]\(([^)]+)\)", content):
                  if target.startswith(("http://", "https://", "data:")):
                      continue
                  target = target.split("#", 1)[0]
                  if target and not (path.parent / target).resolve().exists():
                      errors.append(f"{path}: missing image {target}")
              for target in re.findall(r"(?<!!)\[[^\]]+\]\(([^)]+)\)", content):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = target.split("#", 1)[0]
                  if clean and not (path.parent / clean).resolve().exists():
                      errors.append(f"{path}: missing local link {target}")
              fences = re.findall(r"^([~]{3,}|[" + chr(96) + r"]{3,})", content, flags=re.M)
              if len(fences) % 2:
                  errors.append(f"{path}: unclosed fenced code block")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(markdown)} Markdown files and local references.")
          PY
      - name: Verify hero SVG exists
        run: test -s assets/banners/api-gateway-tripzy.svg
